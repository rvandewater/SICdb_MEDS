name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e .[tests]

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          pytest src/ tests/ -v --cov=src --junitxml=junit.xml -s

      # Doctests for the helper modules. Scoped to these files rather than all of `src/`, which is
      # what the step above used to do: `pre_MEDS.py` carries a long-broken doctest (it reads
      # `tests/operations_synthetic.csv`, a fixture this repo does not have -- it was copied from
      # the template), so the unscoped run has been failing. Fixing that is out of scope here.
      - name: Run doctests
        run: |
          pytest --doctest-modules src/SICdb_MEDS/utils.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
