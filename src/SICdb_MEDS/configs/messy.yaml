# MESSY config for the SICdb MEDS ETL (MEDS-Extract >= 0.7).
#
# This single file replaces what used to be spread across four places:
#   - `dataset.yaml`               -> the `sources:` block below
#   - `download.py`                -> the `sources:` block below
#   - `configs/ETL.yaml`           -> the `etl:` block below (the stage DAG is now canonical)
#   - `configs/event_configs.yaml` -> the event tables below, rewritten in dftly
#
# Run the whole ETL with:
#   meds-extract-run spec=SICdb output_dir=$OUTPUT_DIR
# (see README.md; `SICdb` is registered via the `MEDS_extract.pipelines` entry point).

sources:
  dataset_version: 1.0.8

  dataset:
    - type: physionet
      base_url: https://physionet.org/files/sicdb/${sources.dataset_version}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      # `auto` expands any archive members in the release and is a no-op on everything else.
      unarchive: auto

etl:
  dataset_name: SICdb
  n_subjects_per_shard: 1000

_defaults:
  subject_id: $PatientID

# ---------------------------------------------------------------------------
# NOTE ON NULL HANDLING
#
# Under 0.6.x a null component of an interpolated code was silently rendered as the literal
# "UNK" and the row was kept. In 0.7.0 a composite code null-propagates and the row is DROPPED.
# Every component below is therefore coalesced with `?? 'UNK'` to preserve the previous
# row-retention behaviour exactly. Where a null component *should* drop the row instead, remove
# the corresponding `?? 'UNK'` -- that is a data-modelling decision for the maintainers.
# ---------------------------------------------------------------------------

patient:
  death_time: # Relative Time, The time for death
    code: MEDS_DEATH
    time: $date_of_death
  age: # Number, Age of the patient on the operation date
    code: MEDS_BIRTH
    time: $date_of_birth
  admission_time: # Relative Time, The time for the first admission
    code: ADMISSION
    time: $first_admitted_at_time
  discharge_time:
    code: DISCHARGE
    time: $time_of_discharge

cases:
  sex: # M/F, Sex of the patient
    code: 'f"SEX//{$Sex ?? ''UNK''}"'
    time: null
  weight:
    code: WEIGHT
    numeric_value: $WeightOnAdmission
    time: $AdmissionYear
  height:
    code: HEIGHT
    time: $AdmissionYear
    numeric_value: $HeightOnAdmission
  heart_surgery_begin:
    code: HEART_SURGERY
    time: $HeartSurgeryBeginOffset
  heart_surgery_end:
    code: HEART_SURGERY_END
    time: $HeartSurgeryEndOffset
  readmission:
    code: ADMISSION
    time: $OffsetAfterFirstAdmission
  ICD10Main:
    code: 'f"DIAGNOSIS//ICD10//{$ICD10Main ?? ''UNK''}"'
    text_value: $ICD10MainText
    time: null

laboratory:
  lab:
    code: 'f"LAB//LOINC//{$LOINC_code ?? ''UNK''}//{$ReferenceUnit ?? ''UNK''}"'
    time: $Offset
    numeric_value: $LaboratoryValue
    text_value: $LaboratoryType

medication:
  medication:
    code: 'f"MEDICATION//{$ReferenceName ?? ''UNK''}"'
    time: $Offset
    numeric_value: $Amount
    text_value: $AmountPerMinute
  medication_stop:
    code: >-
      f"MEDICATION_END//{$ReferenceName ?? 'UNK'}//{$ReferenceValue ?? 'UNK'}//{$ReferenceUnit ?? 'UNK'}"
    time: $OffsetDrugEnd
    numeric_value: $Amount
    text_value: $AmountPerMinute

data_float_h:
  vital:
    code: 'f"VITAL//{$ReferenceValue ?? ''UNK''}//{$ReferenceUnit ?? ''UNK''}"'
    time: $Offset
    numeric_value: $Val
    text_value: $ReferenceValue
