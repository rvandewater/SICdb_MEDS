# suMEDS rules for SICdb MEDS codes (format `sumeds-rules/0.1`, see
# https://github.com/rvandewater/SumMEDS/blob/main/docs/enrichment.md).
#
# This ETL describes every code from SICdb's own tables but adds no vocabulary parents. Run suMEDS
# with this file over `metadata/codes.parquet` to add them (README section "Enriching code metadata
# with suMEDS"):
#
#   suMEDS-enrich $MEDS_cohort_dir/metadata/codes.parquet -o codes-enriched.parquet \
#     --rules src/SICdb_MEDS/sumeds_rules.yaml
#
# Code layouts (configs/event_configs.yaml; MEDS-Transforms fills a missing component with UNK):
#   DIAGNOSIS//ICD10//{cases.ICD10Main}             e.g. DIAGNOSIS//ICD10//S62.60
#   LAB//LOINC//{d_references.LOINC_code}//{unit}  e.g. LAB//LOINC//2160-0//mg/dl

schema: sumeds-rules/0.1

ontology:
  # SICdb does not name its ICD-10 version. Austrian hospitals code with the Austrian ICD-10, based on
  # the German-language WHO ICD-10, with some five-character codes taken from ICD-10-GM, so WHO
  # `ICD10` is an inference: a three- or four-character code is tagged as itself, a five-character
  # code (`S62.60`) as its four-character subcategory (`S62.6`). Other shapes are not tagged. WHO
  # ICD-10 may not be redistributed, so suMEDS has no pack for it: `validate: none` tags the code,
  # or validates it when your Athena download has the ICD10 vocabulary.
  - id: sicdb-diagnosis-icd10
    pattern: '^DIAGNOSIS//ICD10//(?P<code>[A-Z][0-9]{2}(?:\.[0-9])?[0-9]?)$'
    vocabulary: ICD10
    normalize:
      - { pattern: '^([A-Z][0-9]{2}(?:\.[0-9])?)[0-9]$', replace: '\1' }
    validate: none
  # The LOINC code is SICdb's own (`d_references.LOINC_code`, since 1.0.8). Validating it against
  # the suMEDS LOINC pack replaces a well-formedness and check-digit test: a code that is not in
  # LOINC gets no parent.
  - id: sicdb-lab-loinc
    pattern: "^LAB//LOINC//(?P<code>[0-9]{1,5}-[0-9])(?://|$)"
    vocabulary: LOINC
    validate: pack

hierarchy:
  # A diagnosis code's nearest shorter ICD-10 code that also occurs in the data (`S62.60` gets
  # `S62.6` if present, else `S62`), skipping the dot.
  - id: sicdb-diagnosis-icd10-prefix
    pattern: '^(?P<prefix>DIAGNOSIS//ICD10//)(?P<code>[A-Z][0-9]{2}(?:\.[0-9A-Z]{1,4})?)$'
    group: code
    mode: prefix
    ignore: "."
