[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SICdb-MEDS"
# Static so `uv version --bump <part>` can manage it. Releases tag this exact string (no `v`
# prefix), and the publish workflow refuses a tag that disagrees. See DEVELOPMENT.md.
version = "0.1.0"
authors = [
  { name="Robin van de Water", email="robin.vandewater@hpi.de" },
]
description = "An ETL pipeline to extract the Salzburg Intensive Care database (SICdb) into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.8's own floor and ceiling. A looser range admits interpreters it cannot
# be installed on, and uv then refuses to resolve at all.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: MEDS-Extract supplies both CLIs and every extraction stage, and fences the
# MEDS-transforms / polars / hydra versions itself. Pinning those here only creates drift -- the
# stale `MEDS-transforms>=0.6.7,<0.7` made the project unresolvable against meds-extract 0.7.
# 0.8 is the floor because it renamed the MESSY `_table.join` key to `_table.joins`, which this
# config uses; 0.7 rejects the new key and 0.8 rejects the old one.
# suMEDS provides `suMEDS-extract`, which runs this ETL and then enriches its code metadata with
# the rules registered below. 0.6 is the floor because it writes `parent_names` as a map from
# code to name; it is capped below the next minor because its rules format and CLI are still 0.x.
dependencies = [
  "MEDS-extract[download]>=0.8.0,<0.9",
  "sumeds>=0.6,<0.7",
]

# The whole pipeline is this one data file. setuptools-scm used to ship it implicitly (its git file
# finder), so without it the wheel would build and install fine but have no pipeline in it.
# `sumeds_rules.yaml` is the suMEDS enrichment rules file, registered below (README, "Enriching
# code metadata with suMEDS").
[tool.setuptools.package-data]
SICdb_MEDS = ["messy.yaml", "sumeds_rules.yaml"]

[project.optional-dependencies]
dev = ["pre-commit<4"]
tests = ["pytest", "pytest-cov"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Development tools. Unlike an extra, uv installs the `dev` group by default on every `uv sync`
# and `uv run`, so a plain `uv sync` can't uninstall pre-commit from under the git hook. Groups
# are not published in the wheel's metadata. CI installs it with `pip install --group dev`.
[dependency-groups]
dev = ["pre-commit<4", "pytest", "pytest-cov"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=SICdb output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
SICdb = "SICdb_MEDS:messy.yaml"

# Registers the suMEDS rules under the same name, so `suMEDS-extract spec=SICdb` and
# `suMEDS-enrich --rules SICdb` find them.
[project.entry-points."sumeds.rules"]
SICdb = "SICdb_MEDS:sumeds_rules.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/SICdb_MEDS"
Issues = "https://github.com/rvandewater/SICdb_MEDS/issues"
