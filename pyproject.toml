[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SICdb-MEDS"
dynamic = ["version"]
authors = [
  { name="Robin van de Water", email="robin.vandewater@hpi.de" },
]
description = "An ETL pipeline to extract the Salzburg Intensive Care database (SICdb) into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.7 own floor and ceiling. A looser range admits interpreters it cannot
# be installed on, and uv then refuses to resolve at all.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: MEDS-Extract supplies both CLIs and every extraction stage, and fences the
# MEDS-transforms / polars / hydra versions itself. Pinning those here only creates drift -- the
# stale `MEDS-transforms>=0.6.7,<0.7` made the project unresolvable against meds-extract 0.7.
dependencies = ["MEDS-extract[download]>=0.7.0,<0.8"]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = ["pre-commit<4"]
tests = ["pytest", "pytest-cov"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=SICdb output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
SICdb = "SICdb_MEDS:messy.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/SICdb_MEDS"
Issues = "https://github.com/rvandewater/SICdb_MEDS/issues"
